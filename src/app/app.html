<div class="page-root">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-wrap">
        <h1 class="brand">🌦️ Weather Report</h1>
        <p class="tag">Quick local weather & 5-day forecast 🌍</p>
      </div>

      <div class="header-controls">
        <app-clock-widget></app-clock-widget>

        <button class="gps-btn" (click)="detectLocation()" title="Detect my location">📍 Detect</button>

        <button class="dark-btn" (click)="toggleDark()" title="Toggle dark mode">
          {{ isDark ? '🌞 Light' : '🌙 Dark' }}
        </button>
      </div>
    </div>
  </header>

  <br><br>

  <main class="main-wrap">
    <section class="search-area d-flex justify-content-center mt-3">
      <app-search-location (locationSelected)="onLocationSelected($event)"></app-search-location>
    </section>

    <section class="weather-area" *ngIf="selectedLat !== null && selectedLon !== null" aria-live="polite">

      <div class="controls">
        <button class="toggle-btn" (click)="showDetails = !showDetails">
          {{ showDetails ? '🙈 Hide Details' : '🔍 Show Details' }}
        </button>

        <div class="coords">📍 Lat: <strong>{{ selectedLat }}</strong> • Lon: <strong>{{ selectedLon }}</strong></div>
      </div>

      <div class="details-grid" *ngIf="showDetails">
        <div class="card current-card">
          <h2 class="card-title">🌡️ Current</h2>
          <app-current-weather [lat]="selectedLat!" [lon]="selectedLon!"></app-current-weather>
        </div>

        <div class="card forecast-card">
          <h2 class="card-title">📅 Forecast</h2>
          <app-forecast-weather [lat]="selectedLat!" [lon]="selectedLon!"></app-forecast-weather>
        </div>

        <div class="card map-card">
          <h2 class="card-title">📍 Map</h2>
          <app-map-view [lat]="selectedLat!" [lon]="selectedLon!"></app-map-view>
        </div>

      </div>

    </section>
  </main>

  <footer class="footer">
    <small>⚡ Powered by OpenWeather & your backend • Built with Angular ❤️</small>
  </footer>
</div>
