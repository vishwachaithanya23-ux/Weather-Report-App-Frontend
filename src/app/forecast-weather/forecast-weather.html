<div class="forecast-page">

  <!-- Graph Section -->
  <section class="graph-section">
    <app-temp-graph [forecast]="forecast.daily"></app-temp-graph>
  </section>

  <!-- Forecast Cards -->
  <section class="cards-section" *ngIf="forecast">
    <div class="day-card"
         *ngFor="let d of forecast.daily; let i = index"
         [style.animationDelay]="(i * 80) + 'ms'">
      
      <div class="day-head">
        <div class="weekday">{{ (d.dt * 1000) | date:'EEE' }}</div>
        <div class="date">{{ (d.dt * 1000) | date:'d MMM' }}</div>
      </div>

      <div class="temps">
        <span>▲ {{ d.temp.max }}°C</span>
        <span>▼ {{ d.temp.min }}°C</span>
      </div>

      <div class="desc">{{ d.weather[0].description | titlecase }}</div>
    </div>
  </section>

</div>

<ng-template #loadTpl>
  <div class="loading" *ngIf="loading">Loading forecast…</div>
  <div class="error" *ngIf="error">{{ error }}</div>
</ng-template>
